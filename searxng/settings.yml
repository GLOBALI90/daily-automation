use_default_settings: true

general:
  debug: false
  instance_name: "ROZHAN Search"

search:
  formats:
    - html
    - json

server:
  # Overridden by the Render environment variable SEARXNG_SECRET.
  secret_key: "${SEARXNG_SECRET}"
  limiter: false
  public_instance: false
  image_proxy: false
  port: 8080
  bind_address: "0.0.0.0"
