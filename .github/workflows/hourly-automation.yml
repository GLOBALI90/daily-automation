name: ROZHAN Hourly Automation

on:
  workflow_dispatch:
    inputs:
      social_platform:
        description: "Social network for this manual test"
        required: false
        type: choice
        options:
          - auto
          - linkedin
          - instagram
          - facebook
          - x
        default: auto
      send_emails:
        description: "Actually send outreach emails (leave false during validation)"
        required: false
        type: boolean
        default: false
      social_max_items:
        description: "Maximum social profiles to process in this run (start with 1 to limit provider usage)"
        required: false
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "1"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile src/*.py

      - name: Validate Gemini credentials and model before collection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: |
          python - <<'PY'
          import os
          import requests

          key = os.getenv("GEMINI_API_KEY", "").strip()
          model = os.getenv("GEMINI_MODEL", "").strip()
          if not key:
              raise SystemExit("GEMINI_API_KEY is missing from GitHub Actions secrets.")
          if not model:
              raise SystemExit("GEMINI_MODEL is not configured.")

          url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
          try:
              response = requests.post(
                  url,
                  params={"key": key},
                  json={"contents": [{"parts": [{"text": "Reply with exactly: OK"}]}]},
                  timeout=30,
              )
          except requests.RequestException as exc:
              raise SystemExit(f"Gemini preflight network error: {type(exc).__name__}") from None

          if not response.ok:
              try:
                  detail = response.json().get("error", {}).get("message", "No API error message returned.")
              except ValueError:
                  detail = "Gemini returned a non-JSON error response."
              detail = str(detail).replace(key, "[REDACTED]")[:700]
              raise SystemExit(f"Gemini preflight failed: HTTP {response.status_code}: {detail}")

          try:
              payload = response.json()
              text = payload["candidates"][0]["content"]["parts"][0]["text"].strip()
          except (ValueError, KeyError, IndexError, TypeError):
              raise SystemExit("Gemini API returned success but no usable text candidate.") from None
          if not text:
              raise SystemExit("Gemini returned an empty response during preflight.")
          print("Gemini authentication and model preflight succeeded.")

          PY

      - name: Collect social leads (3 max, one network per run, provider fallback chain)
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SOCIALFETCH_API_KEY: ${{ secrets.SOCIALFETCH_API_KEY }}
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          SOCIAL_DEEP_BACKUP_TOKEN: ${{ secrets.SOCIAL_DEEP_BACKUP_TOKEN }}
          SOCIAL_DEEP_BACKUP_URL: https://patient-moon-b87e.mohamadsbrfit760li.workers.dev
          SOCIAL_PLATFORM: ${{ inputs.social_platform || 'auto' }}
          SOCIAL_MAX_ITEMS: ${{ inputs.social_max_items || '1' }}
        run: python src/social_collector.py

      - name: Collect leads with Gemini-planned search
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
        run: python src/run_collector_resilient.py

      - name: Generate AI outreach and send Gmail
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          SEND_EMAILS: ${{ inputs.send_emails }}
          GMAIL_USERNAME: 'saberi.export.import@gmail.com'
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python src/process_leads.py

      - name: Save results
        run: |
          git config user.name "rozhanglobal-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Add bounded social provider fallback chain"
          git push
