name: ROZHAN Hourly Automation

on:
  workflow_dispatch:
    inputs:
      social_platform:
        description: "Only Facebook and LinkedIn are enabled during focused collection"
        required: false
        type: choice
        options:
          - auto
          - facebook
          - linkedin
        default: auto
      send_emails:
        description: "Actually send outreach emails to qualified leads with public business email addresses"
        required: false
        type: boolean
        default: false
      send_whatsapp:
        description: "Actually send WhatsApp outreach through WAHA to qualified leads with public international numbers"
        required: false
        type: boolean
        default: false
      social_max_items:
        description: "Hard-capped at one profile per run to respect the Cloudflare Worker daily limit"
        required: false
        type: choice
        options:
          - "1"
        default: "1"


  # Four scheduled runs per UTC day, spaced six hours apart.
  # Keep aligned with the Cloudflare Worker cap of four Browser Run actions/day.
  schedule:
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

# Prevent overlapping runs from racing the Worker KV daily action counter.
concurrency:
  group: rozhan-global-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile src/*.py

      - name: Test social provider fallback and response quality
        run: python -m unittest discover -s tests -v

      - name: Validate Gemini credentials and model before collection
        if: github.event_name != 'workflow_dispatch' || inputs.social_platform == 'auto'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODELS: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src")
          from gemini_utils import generate_text

          try:
              text = generate_text("Reply with exactly: OK")
          except Exception as exc:
              print(f"Gemini preflight failed after retries/fallback: {type(exc).__name__}: {exc}")
              raise SystemExit(1) from None
          if not text:
              raise SystemExit("Gemini preflight returned no usable text.")
          print("Gemini authentication and generation preflight succeeded.")
          PY

      - name: Collect public social leads (native platform/provider discovery; hard cap one profile per run)
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SOCIALFETCH_API_KEY: ${{ secrets.SOCIALFETCH_API_KEY }}
          DECODO_API_KEY: ${{ secrets.DECODO_API_KEY }}
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
          SOCIAL_DEEP_BACKUP_TOKEN: ${{ secrets.SOCIAL_DEEP_BACKUP_TOKEN }}
          SOCIAL_DEEP_BACKUP_URL: https://patient-moon-b87e.mohamadsbrfit760li.workers.dev
          SOCIAL_PLATFORM: ${{ inputs.social_platform || 'auto' }}
          SOCIAL_MAX_ITEMS: ${{ inputs.social_max_items || '1' }}
        run: python src/social_collector.py

      - name: Collect leads with Gemini-planned search
        # A manual network-specific test should isolate that network instead of
        # failing the run because the unrelated general lead collector found no fresh leads.
        if: github.event_name != 'workflow_dispatch' || inputs.social_platform == 'auto'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODELS: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
          YDC_API_KEY: ${{ secrets.YDC_API_KEY }}
          SEARXNG_URL: ${{ secrets.SEARXNG_URL }}
        run: python src/run_collector_resilient.py

      - name: Generate AI outreach and send Gmail
        if: github.event_name != 'workflow_dispatch' || inputs.social_platform == 'auto'
        timeout-minutes: 6
        env:
          PYTHONUNBUFFERED: "1"
          GEMINI_TIMEOUT_MS: "15000"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_FALLBACK_MODELS: gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite
          SEND_EMAILS: ${{ github.event_name == 'workflow_dispatch' && inputs.send_emails || false }}
          GMAIL_USERNAME: 'saberi.export.import@gmail.com'
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WHATSAPP_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.send_whatsapp || false }}
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
          WAHA_SESSION: ${{ secrets.WAHA_SESSION }}
        run: python -u src/process_leads.py

      - name: Save results
        if: always()
        run: |
          git config user.name "rozhanglobal-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Save automation collection results"
            # Integrate commits that landed on main while this run was collecting.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No data changes to save."
          fi
