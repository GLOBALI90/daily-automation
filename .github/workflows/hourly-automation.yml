name: ROZHAN Hourly Automation

on:
  workflow_dispatch:
    inputs:
      social_platform:
        description: "Collect from both Facebook and LinkedIn in auto mode"
        required: false
        type: choice
        options:
          - auto
          - facebook
          - linkedin
        default: auto
      social_max_items:
        description: "Collect up to five valid leads per run; Cloudflare Worker remains capped separately"
        required: false
        type: choice
        options:
          - "5"
        default: "5"
      validation_only:
        description: "Run syntax and unit tests only; skip all external APIs, collection, outreach, and data writes"
        required: false
        type: boolean
        default: false

  # Four scheduled runs per UTC day, spaced six hours apart.
  # Keep aligned with the Cloudflare Worker cap of four Browser Run actions/day.
  schedule:
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

# Prevent overlapping runs from racing the Worker KV daily action counter.
concurrency:
  group: rozhan-global-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile src/*.py

      - name: Test social provider fallback and response quality
        run: python -m unittest discover -s tests -v

      - name: Collect public social leads from Facebook and LinkedIn (up to five valid leads per run)
        if: ${{ !inputs.validation_only }}
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SOCIALFETCH_API_KEY: ${{ secrets.SOCIALFETCH_API_KEY }}
          SOCIAL_DEEP_BACKUP_TOKEN: ${{ secrets.SOCIAL_DEEP_BACKUP_TOKEN }}
          SOCIAL_DEEP_BACKUP_URL: https://patient-moon-b87e.mohamadsbrfit760li.workers.dev
          SOCIAL_PLATFORM: ${{ inputs.social_platform || 'auto' }}
          SOCIAL_MAX_ITEMS: ${{ inputs.social_max_items || '5' }}
        run: python src/social_collector.py

      - name: Wake WAHA and confirm WhatsApp session before outreach (never sends messages)
        if: ${{ !inputs.validation_only }}
        env:
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_SESSION: ${{ secrets.WAHA_SESSION }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          base = os.environ.get("WAHA_URL", "").strip().rstrip("/")
          session = os.environ.get("WAHA_SESSION", "").strip()
          key = os.environ.get("WAHA_API_KEY", "").strip()
          ready = False

          if not base or not session or not key:
              print("WAHA_PREFLIGHT=CONFIG_MISSING; WhatsApp will be skipped.")
          else:
              if "/api/" in base or base.endswith("/api"):
                  print("WAHA_PREFLIGHT=CONFIG_ERROR; WAHA_URL must be the service base URL without /api.")
              else:
                  headers = {"X-Api-Key": key, "Accept": "application/json"}
                  session_url = base + "/api/sessions/" + quote(session, safe="")

                  def get(url, timeout=12):
                      try:
                          req = Request(url, headers=headers, method="GET")
                          with urlopen(req, timeout=timeout) as response:
                              return response.status, response.read(65536).decode("utf-8", errors="replace")
                      except HTTPError as exc:
                          return exc.code, ""
                      except (URLError, TimeoutError, OSError) as exc:
                          print(f"WAHA_REQUEST_ERROR={type(exc).__name__}")
                          return None, ""

                  # First request targets the service root to wake a sleeping Render Free instance.
                  # Then probe the actual session on each retry; do not treat a splash page as ready.
                  for attempt in range(1, 7):
                      root_code, _ = get(base)
                      session_code, body = get(session_url)
                      state = ""
                      if session_code == 200:
                          try:
                              data = json.loads(body)
                              state = str(data.get("status", "")).upper() if isinstance(data, dict) else ""
                          except json.JSONDecodeError:
                              state = ""
                      print(f"WAHA_PREFLIGHT_ATTEMPT={attempt}; root_http={root_code}; session_http={session_code}; state={state or 'UNKNOWN'}")
                      if session_code == 200 and state == "WORKING":
                          ready = True
                          break
                      if attempt < 6:
                          time.sleep(10)

                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                      env_file.write("WAHA_READY=" + ("true" if ready else "false") + "\\n")
                  print("WAHA_PREFLIGHT=READY" if ready else "WAHA_PREFLIGHT=UNAVAILABLE; WhatsApp sending is blocked for this run.")
          if not ready:
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
                  env_file.write("WAHA_READY=false\\n")
          PY

      - name: Generate and send B2B outreach (email and WhatsApp enabled; max three leads per run)
        if: ${{ !inputs.validation_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          SEND_EMAILS: "true"
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WHATSAPP_ENABLED: "true"
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_SESSION: ${{ secrets.WAHA_SESSION }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
        run: python src/process_leads.py

      - name: Save results
        if: ${{ always() && !inputs.validation_only }}
        run: |
          git config user.name "rozhanglobal-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Save automation collection and outreach results"
            # Integrate commits that landed on main while this run was collecting.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No data changes to save."
          fi
