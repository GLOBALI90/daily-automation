name: ROZHAN Hourly Automation

on:
  workflow_dispatch:
    inputs:
      social_platform:
        description: "Collect from both Facebook and LinkedIn in auto mode"
        required: false
        type: choice
        options:
          - auto
          - facebook
          - linkedin
        default: auto
      social_max_items:
        description: "Collect up to five valid leads per run; Cloudflare Worker remains capped separately"
        required: false
        type: choice
        options:
          - "5"
        default: "5"
      validation_only:
        description: "Run syntax and unit tests only; skip all external APIs, collection, outreach, and data writes"
        required: false
        type: boolean
        default: false

  # Four scheduled runs per UTC day, spaced six hours apart.
  # Keep aligned with the Cloudflare Worker cap of four Browser Run actions/day.
  schedule:
    - cron: "0 0,6,12,18 * * *"

permissions:
  contents: write

# Prevent overlapping runs from racing the Worker KV daily action counter.
concurrency:
  group: rozhan-global-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile src/*.py

      - name: Test social provider fallback and response quality
        run: python -m unittest discover -s tests -v

      - name: Collect public social leads from Facebook and LinkedIn (up to five valid leads per run)
        if: ${{ !inputs.validation_only }}
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SOCIALFETCH_API_KEY: ${{ secrets.SOCIALFETCH_API_KEY }}
          SOCIAL_DEEP_BACKUP_TOKEN: ${{ secrets.SOCIAL_DEEP_BACKUP_TOKEN }}
          SOCIAL_DEEP_BACKUP_URL: https://patient-moon-b87e.mohamadsbrfit760li.workers.dev
          SOCIAL_PLATFORM: ${{ inputs.social_platform || 'auto' }}
          SOCIAL_MAX_ITEMS: ${{ inputs.social_max_items || '5' }}
        run: python src/social_collector.py

      - name: Check WAHA readiness with bounded retries (never sends messages)
        if: ${{ !inputs.validation_only }}
        env:
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_SESSION: ${{ secrets.WAHA_SESSION }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          base = os.environ.get("WAHA_URL", "").strip().rstrip("/")
          session = os.environ.get("WAHA_SESSION", "").strip()
          key = os.environ.get("WAHA_API_KEY", "").strip()
          ready = False
          if not base or not session or not key:
              print("WAHA_PREFLIGHT=CONFIG_MISSING; WhatsApp will be skipped.")
          else:
              url = base + "/api/sessions/" + quote(session, safe="")
              headers = {"X-Api-Key": key, "Accept": "application/json"}
              for attempt in range(1, 4):
                  # A probe/retry can detect a recovering service, but Blitz says
                  # automated requests do not wake free sleeping apps.
                  try:
                      req = Request(url, headers=headers, method="GET")
                      with urlopen(req, timeout=12) as response:
                          body = response.read(65536).decode("utf-8", errors="replace")
                          code = response.status
                  except HTTPError as exc:
                      code, body = exc.code, ""
                  except (URLError, TimeoutError, OSError) as exc:
                      code, body = None, ""
                      print(f"WAHA_PREFLIGHT_ATTEMPT={attempt}; request_error={type(exc).__name__}")
                  print(f"WAHA_PREFLIGHT_ATTEMPT={attempt}; session_http_status={code}")
                  if code == 200:
                      try:
                          data = json.loads(body)
                          state = str(data.get("status", "")).upper() if isinstance(data, dict) else ""
                      except json.JSONDecodeError:
                          state = ""
                      print(f"WAHA_PREFLIGHT_SESSION_STATE={state or 'UNKNOWN'}")
                      if state == "WORKING":
                          ready = True
                          break
                  if attempt < 3:
                      time.sleep(10)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write("WAHA_READY=" + ("true" if ready else "false") + "\\n")
          print("WAHA_PREFLIGHT=READY" if ready else "WAHA_PREFLIGHT=UNAVAILABLE; WhatsApp disabled for this run, email may continue.")
          PY

      - name: Generate and send B2B outreach (email and WhatsApp enabled; max three leads per run)
        if: ${{ !inputs.validation_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          SEND_EMAILS: "true"
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WHATSAPP_ENABLED: ${{ env.WAHA_READY == 'true' && 'true' || 'false' }}
          WAHA_URL: ${{ secrets.WAHA_URL }}
          WAHA_SESSION: ${{ secrets.WAHA_SESSION }}
          WAHA_API_KEY: ${{ secrets.WAHA_API_KEY }}
        run: python src/process_leads.py

      - name: Save results
        if: ${{ always() && !inputs.validation_only }}
        run: |
          git config user.name "rozhanglobal-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Save automation collection and outreach results"
            # Integrate commits that landed on main while this run was collecting.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No data changes to save."
          fi
