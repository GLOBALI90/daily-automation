permissions:
  contents: write

# Prevent overlapping runs from racing the Worker KV daily action counter.
concurrency:
  group: rozhan-global-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile src/*.py

      - name: Test social provider fallback and response quality
        run: python -m unittest discover -s tests -v

      - name: Collect product prospects (Composio, capped Cloudflare web/Maps, Firecrawl fallback) or social leads
        if: ${{ !inputs.validation_only }}
        env:
          PRODUCT_NAME: ${{ inputs.custom_product || inputs.product_name || 'industrial lubricants' }}
          TARGET_MARKET: ${{ inputs.target_market || 'China' }}
          COLLECTION_MODE: ${{ inputs.collection_mode || 'product_web' }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_FIRECRAWL_CONNECTED_ACCOUNT_ID: ${{ vars.COMPOSIO_FIRECRAWL_CONNECTED_ACCOUNT_ID || 'firecrawl_eurite-sext' }}
          COMPOSIO_USER_ID: 'GLOBALI90'
          CLOUDFLARE_PRIMARY_ENRICHMENT: 'true'
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SOCIAL_DEEP_BACKUP_TOKEN: ${{ secrets.SOCIAL_DEEP_BACKUP_TOKEN }}
          SOCIAL_DEEP_BACKUP_URL: ${{ vars.SOCIAL_DEEP_BACKUP_URL || 'https://patient-moon-b87e.mohamadsbrfit760li.workers.dev' }}
          SOCIAL_PLATFORM: ${{ inputs.social_platform || 'auto' }}
          SOCIAL_MAX_ITEMS: ${{ inputs.social_max_items || '3' }}
          SOCIAL_REQUEST_INTERVAL_SECONDS: '15'
        run: python src/social_collector.py

      - name: Automatic qualified product outreach or opt-in social outreach
        if: ${{ !inputs.validation_only && ((inputs.collection_mode || 'product_web') == 'product_web' || inputs.outreach_enabled) }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          OUTREACH_SOURCE: ${{ inputs.collection_mode || 'product_web' }}
          SEND_EMAILS: ${{ (inputs.collection_mode || 'product_web') == 'product_web' && 'true' || (inputs.outreach_enabled && 'true' || 'false') }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WHATSAPP_ENABLED: ${{ (inputs.collection_mode || 'product_web') == 'product_web' && 'true' || (inputs.outreach_enabled && 'true' || 'false') }}
          WUAPI_API_KEY: ${{ secrets.WUAPI_API_KEY }}
          WUAPI_ACCOUNT_ID: j57bvn1pvvfe2kg6zadtxxh3618gayex
        run: python src/process_leads.py

      - name: Save results
        if: ${{ always() && !inputs.validation_only && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "rozhanglobal-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Save automation collection and outreach results"
            # Integrate commits that landed on main while this run was collecting.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No data changes to save."
          fi

      - name: Upload social and Cloudflare run report
        if: ${{ always() && !inputs.validation_only }}
        uses: actions/upload-artifact@v4
        with:
          name: social-run-report-${{ github.run_id }}
          path: |
            data/social_run_report.json
            data/personal_profiles.csv
            data/product_leads.csv
          if-no-files-found: warn
          retention-days: 14
