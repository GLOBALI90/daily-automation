name: ROZHAN Hourly Automation

on:
  workflow_dispatch:
    inputs:
      social_platform:
        description: "Collect public pages from the selected networks; save relevant LinkedIn people as account-only records"
        required: false
        type: choice
        options:
          - auto
          - facebook
          - linkedin
        default: auto
      social_max_items:
        description: "Up to three qualified company leads plus relevant public LinkedIn personal account IDs"
        required: false
        type: choice
        options:
          - "3"
          - "5"
        default: "3"
      outreach_enabled:
        description: "Enable outbound email and WhatsApp delivery. Leave off to collect/review leads without sending."
        required: false
        type: boolean
        default: false
      validation_only:
        description: "Run syntax and unit tests only; skip all external APIs, collection, outreach, and data writes"
        required: false
        type: boolean
        default: false

  # Four scheduled runs per UTC week to keep outbound WhatsApp usage conservative.
  schedule:
    - cron: "0 9 * * 1,3,5,0"

permissions:
  contents: write

# Prevent overlapping runs from racing the Worker KV daily action counter.
concurrency:
  group: rozhan-global-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile src/*.py

      - name: Test social provider fallback and response quality
        run: python -m unittest discover -s tests -v

      - name: Collect public social leads and account-only LinkedIn profiles
        if: ${{ !inputs.validation_only }}
        env:
          SCRAPECREATORS_API_KEY: ${{ secrets.SCRAPECREATORS_API_KEY }}
          SOCIAL_DEEP_BACKUP_TOKEN: ${{ secrets.SOCIAL_DEEP_BACKUP_TOKEN }}
          SOCIAL_DEEP_BACKUP_URL: ${{ vars.SOCIAL_DEEP_BACKUP_URL || 'https://patient-moon-b87e.mohamadsbrfit760li.workers.dev' }}
          SOCIAL_PLATFORM: ${{ inputs.social_platform || 'auto' }}
          SOCIAL_MAX_ITEMS: ${{ inputs.social_max_items || '3' }}
          SOCIAL_REQUEST_INTERVAL_SECONDS: '15'
        run: python src/social_collector.py

      - name: Generate outreach drafts (delivery controlled by outreach_enabled; max five leads per run)
        if: ${{ !inputs.validation_only }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.6-flash' }}
          SEND_EMAILS: ${{ inputs.outreach_enabled && 'true' || 'false' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WHATSAPP_ENABLED: ${{ inputs.outreach_enabled && 'true' || 'false' }}
          WUAPI_API_KEY: ${{ secrets.WUAPI_API_KEY }}
          WUAPI_ACCOUNT_ID: j57bvn1pvvfe2kg6zadtxxh3618gayex
        run: python src/process_leads.py

      - name: Save results
        if: ${{ always() && !inputs.validation_only }}
        run: |
          git config user.name "rozhanglobal-automation"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Save automation collection and outreach results"
            # Integrate commits that landed on main while this run was collecting.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          else
            echo "No data changes to save."
          fi

      - name: Upload social and Cloudflare run report
        if: ${{ always() && !inputs.validation_only }}
        uses: actions/upload-artifact@v4
        with:
          name: social-run-report-${{ github.run_id }}
          path: data/social_run_report.json
          if-no-files-found: warn
          retention-days: 14
