name: Wuapi One-Message Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wuapi-one-message-smoke-test
  cancel-in-progress: false

jobs:
  send-one-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send exactly one test message (no inbox reads or webhooks)
        env:
          WUAPI_API_KEY: ${{ secrets.WUAPI_API_KEY }}
          WUAPI_TEST_RECIPIENT: ${{ secrets.WUAPI_TEST_RECIPIENT }}
          WUAPI_ACCOUNT_ID: j57bvn1pvvfe2kg6zadtxxh3618gayex
          IDEMPOTENCY_KEY: wuapi-smoke-${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          api_key = os.environ.get("WUAPI_API_KEY", "").strip()
          recipient = os.environ.get("WUAPI_TEST_RECIPIENT", "").strip()
          account_id = os.environ["WUAPI_ACCOUNT_ID"]
          idempotency_key = os.environ["IDEMPOTENCY_KEY"]

          if not api_key or not recipient:
              print("CONFIG_MISSING: add WUAPI_API_KEY and WUAPI_TEST_RECIPIENT in GitHub Actions secrets.")
              raise SystemExit(1)
          if not re.fullmatch(r"\+[1-9]\d{7,14}", recipient):
              print("CONFIG_INVALID: WUAPI_TEST_RECIPIENT must be an E.164 phone number, stored as a secret.")
              raise SystemExit(1)

          payload = json.dumps({
              "accountId": account_id,
              "to": recipient,
              "text": "GitHub Actions to Wuapi connection test. No reply is needed.",
          }).encode("utf-8")
          request = urllib.request.Request(
              "https://api.wuapi.dev/v1/messages",
              data=payload,
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "Idempotency-Key": idempotency_key,
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  body = response.read(65536).decode("utf-8", errors="replace")
                  try:
                      data = json.loads(body)
                  except ValueError:
                      data = {}
                  print(f"WUAPI_HTTP_STATUS={response.status}")
                  print(f"WUAPI_MESSAGE_STATUS={data.get('status', 'accepted')}")
                  print(f"WUAPI_MESSAGE_ID={data.get('id', 'not_returned')}")
          except urllib.error.HTTPError as exc:
              print(f"WUAPI_HTTP_STATUS={exc.code}")
              try:
                  error_data = json.loads(exc.read(8192).decode("utf-8", errors="replace"))
                  print(f"WUAPI_ERROR_CODE={error_data.get('code', 'api_error')}")
              except (ValueError, AttributeError):
                  print("WUAPI_ERROR_CODE=api_error")
              raise SystemExit(1)
          except (urllib.error.URLError, TimeoutError, OSError) as exc:
              print(f"WUAPI_REQUEST_ERROR={type(exc).__name__}")
              raise SystemExit(1)
          PY
