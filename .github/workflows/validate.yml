name: Validate Automation Code

# TEMPORARILY MANUAL-ONLY while the social-only refactor is being reviewed.
# This avoids automatically running regression tests on each code commit.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-automation-code
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile src/*.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -v
